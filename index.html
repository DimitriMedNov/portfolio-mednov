    <script>
      // Antes del primer pintado: el tema y el idioma no parpadean al recargar.
      // Sin elección guardada mandan las preferencias del sistema y del navegador.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("mednov.theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          root.dataset.theme = t === "light" || t === "dark" ? t : prefersLight ? "light" : "dark";
          var l = localStorage.getItem("mednov.lang");
          root.lang =
            l === "es" || l === "en"
              ? l
              : (navigator.language || "en").toLowerCase().indexOf("es") === 0
                ? "es"
                : "en";
        } catch (e) {
          root.dataset.theme = "dark";
        }
      })();
    </script>
</head>

<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
